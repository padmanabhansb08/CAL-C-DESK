<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0101"><meta name="referrer" content="no-referrer"><title>FFK · Final map wheel</title><link rel="stylesheet" href="fonts.css?v=1"><link rel="stylesheet" href="brand.css?v=2"><link rel="stylesheet" href="wheel.css?v=8"><script src="brand-fx.js?v=6" defer></script><script src="wheel.js?v=6" defer></script></head><body>
<div id="viewport">
 <div id="stage" aria-live="polite">
  <div class="ffk-smoke" aria-hidden="true"></div>
  <img class="wheel-mascot" src="assets/ffk-mascot.webp" alt="" aria-hidden="true">
  <i class="ffk-slash tl" aria-hidden="true"></i><i class="ffk-slash br" aria-hidden="true"></i>
  <div class="rays" aria-hidden="true"></div>
  <canvas id="bolts" width="1920" height="1080" aria-hidden="true"></canvas>

  <div class="wheel-wrap">
   <div class="wheel-glow" aria-hidden="true"></div>
   <canvas id="rim" width="1000" height="1000" aria-hidden="true"></canvas>
   <canvas id="wheel" width="1000" height="1000" role="img" aria-label="Map wheel"></canvas>
   <div class="hub" aria-hidden="true"><div class="hub-face"></div></div>
   <div class="pointer" id="pointer" aria-hidden="true"><svg viewBox="0 0 120 170"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b3b"/><stop offset="1" stop-color="#6a0000"/></linearGradient><linearGradient id="psil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfcfcf"/><stop offset="1" stop-color="#7a7a7a"/></linearGradient></defs>
    <path d="M24 46 L18 14 L40 32 L60 6 L80 32 L102 14 L96 46 Z" fill="#0a0a0a" stroke="#f5f5f5" stroke-width="5" stroke-linejoin="round"/>
    <path d="M14 52 H106 L60 164 Z" fill="url(#pg)" stroke="url(#psil)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M38 66 H82 L60 124 Z" fill="#ff8a7a" opacity=".35"/><circle cx="60" cy="74" r="8" fill="#ffffff"/></svg></div>
  </div>
  <aside class="panel">

   <h1>FINAL <span>MAP</span></h1>

   <ul class="pool" id="pool"></ul>
   <article class="result" id="result" hidden><div class="result-art" id="result-art"></div><span class="result-kicker">THE FINAL MATCH WILL BE PLAYED ON</span><strong id="result-name"></strong></article>
  </aside>
  <canvas id="confetti" width="1920" height="1080" aria-hidden="true"></canvas>
 </div>
</div>
<p id="gate" hidden></p>
</body></html>
