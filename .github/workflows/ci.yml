name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the Vercel/Neon edition parity check (tools/check-postgres.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ffk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/ffk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Python dependencies (includes the OCR engine)
        run: pip install -r requirements-docker.txt
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Logic, security and OCR accuracy checks
        run: npm test
      - name: Browser checks
        run: npm run test:browser
