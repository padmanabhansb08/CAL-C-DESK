# Fly.io deployment configuration for FFK War Desk
# https://fly.io/docs/reference/configuration/

app = "ffk-war-desk"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/war.sqlite3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "ffk_data"
  destination = "/data"
  initial_size = "1gb"
