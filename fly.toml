# Fly.io deployment configuration for FFK War Desk
# https://fly.io/docs/reference/configuration/

app = "ffk-war-desk"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/war.sqlite3"

# Before the first visit run:  fly secrets set SETUP_TOKEN=<long random value>
# and enter it on the first-run screen to create the organizer password.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "ffk_data"
  destination = "/data"
  initial_size = "1gb"
